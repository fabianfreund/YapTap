# Builds YapTap for Windows and Linux when a version tag (v1.2.3) is pushed and
# uploads the installers to a draft release. These builds are unsigned for now.
# macOS is built, signed and notarized locally by scripts/release-mac.sh, which
# adds the Mac files and publishes the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpulse-dev libgtk-layer-shell-dev libxdo-dev cmake
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: YapTap ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Download YapTap for your platform below.
            **Windows:** the installer isn't code-signed yet, so SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
