<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B87FF"/>
      <stop offset="1" stop-color="#5B3DF5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1580" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square inside 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- the pill with voice bars -->
  <g filter="url(#s)">
    <rect x="232" y="402" width="560" height="220" rx="110" fill="#17132b"/>
    <g fill="#fff" stroke-linecap="round">
      <rect x="330" y="482" width="36" height="60" rx="18"/>
      <rect x="398" y="447" width="36" height="130" rx="18"/>
      <rect x="466" y="422" width="36" height="180" rx="18"/>
      <rect x="534" y="462" width="36" height="100" rx="18"/>
      <rect x="602" y="437" width="36" height="150" rx="18"/>
      <rect x="670" y="487" width="36" height="50" rx="18" opacity=".7"/>
    </g>
  </g>
</svg>
