[package]
name = "yaptap"
version = "0.1.0"
description = "Free, open-source, fully local dictation"
edition = "2021"
license = "MIT"

[lib]
name = "yaptap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
handy-keys = "0.3.5"
handy-recorder = "0.1.1"
enigo = "0.6.1"
arboard = "3.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
parking_lot = "0.12"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# Windows and Linux: CPU for v0.1 (no Vulkan SDK or runtime needed). GPU via
# Vulkan "dynamic-backends" is a follow-up, see docs/RESEARCH.md.
[target.'cfg(target_os = "windows")'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
